# Room DSL v3 —— 八楼出租屋·卧室（整房间 3D 建模）
# 真源文件：改这里，图节点字段是编译投影（不一致=图落后，重新编译落图）
# 规范：00_init/RoomDSL-v3-正式修改方案.md（v3）
# 坐标：米；原点=房间地面中心；X右 Y上 Z朝房门(+Z 内门)；rot单位度
# 粒度：只建不移动的固定大件（床/桌/柜/门窗结构）；可移动小物与杂物堆不建几何，其表现写入图 Scene.deco
# 文字归图：deco/atmosphere/time_of_day/weather 等 Scene 文字字段在图节点（本文件 scene 条目只留 camera/lights/objects_delta）
# 尺寸：box=[w,h,d]；plane 贴墙[w,h]（rot绕Y定朝向）；cylinder=[直径,高]
