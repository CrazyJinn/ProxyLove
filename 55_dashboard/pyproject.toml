[project]
name = "dailian-dashboard"
version = "0.1.0"
description = "代恋·图数据库工作流管理页（治理层：审批/看板/图浏览/数据导入）"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.20",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
