{% extends "base.html" %}
{% block title %}{{ head.name }} · 美术链 · 生产看板{% endblock %}
{% block content %}
<p class="crumbs"><a href="/board?tab=char">&larr; 角色看板</a></p>
<h1>{{ head.name }} · 美术链</h1>

<div class="gdetail">
  <div class="gleft">
    <h2>节点结构（status 着色）</h2>
    <div id="artgraph" class="chart"></div>
    <p class="muted small">点击节点 → 右侧编辑框（Cypher SET 保存，写前级联预览）。</p>
    <div id="legend" class="small muted"></div>
  </div>
  <div class="gright">
    <h2 id="editor-title">编辑</h2>
    <div id="editor" class="muted">点击左侧图中任意节点加载属性…</div>
  </div>
</div>

<script src="/static/echarts.min.js"></script>
<script>
const ST_COLORS = { '-1': '#dc2626', '0': '#9ca3af', '1': '#3b82f6', '2': '#3b82f6', '10': '#f59e0b', '11': '#16a34a' };
const ST_TEXT = { '-1': '作废重做', '0': '待处理', '1': '已完成', '2': '图片完成', '10': '待审', '11': '批准' };
const SIZE = { Character: 60, AppearanceStyle: 38, LanguageStyle: 38, CostumeStyle: 34, VoiceDesign: 38, DesignSheet: 42, IllusDesign: 34, StandingIllustration: 26 };
const data = {{ g_json | safe }};
const chart = echarts.init(document.getElementById('artgraph'));
chart.setOption({
  tooltip: {
    formatter: function (p) {
      if (p.dataType === 'edge') return p.data.type;
      return p.data.label + '<br/>' + p.data.name + '<br/>status: ' + (ST_TEXT[p.data.status] || '—');
    },
  },
  series: [{
    type: 'graph', layout: 'force', roam: true, draggable: true,
    label: { show: true, formatter: function (p) { return p.data.name.slice(0, 12); }, fontSize: 10 },
    force: { repulsion: 300, edgeLength: [60, 140], gravity: 0.06 },
    data: data.nodes.map(function (n) {
      return {
        id: n.id, name: n.name, label: n.label, status: n.status == null ? '' : String(n.status),
        symbolSize: SIZE[n.label] || 30,
        itemStyle: { color: ST_COLORS[String(n.status)] || '#6b7280', borderColor: '#fff', borderWidth: n.depth === 0 ? 3 : 1 },
      };
    }),
    links: data.links.map(function (l) { return { source: l.source, target: l.target, value: l.type }; }),
    edgeLabel: { show: false },
  }],
});
chart.on('click', function (p) {
  if (p.dataType !== 'node') return;
  loadEditor(p.data.id, p.data.label, p.data.name);
});
window.addEventListener('resize', function () { chart.resize(); });

const legend = document.getElementById('legend');
legend.innerHTML = Object.keys(ST_TEXT).map(function (k) {
  return '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + ST_COLORS[k] + ';margin:0 3px 0 10px"></span>' + ST_TEXT[k];
}).join('');

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

function loadEditor(id, label, name) {
  fetch('/board/node/' + id + '/props').then(function (r) { return r.json(); }).then(function (d) {
    const box = document.getElementById('editor');
    document.getElementById('editor-title').textContent = '编辑 · ' + label + ' ' + (name || id);
    let html = '<form method="post" action="/board/node/' + id + '/save" id="editform">';
    html += '<input type="hidden" name="node_id" value="' + id + '">';
    html += '<table class="kv"><tr><th>字段</th><th>值</th></tr>';
    d.fields.forEach(function (f) {
      if (f.locked) {
        html += '<tr><th>' + esc(f.key) + '</th><td class="muted small">' + esc(f.value) + ' 🔒（高危字段，Cypher 直改）</td></tr>';
      } else {
        html += '<tr><th>' + esc(f.key) + '</th><td><input class="ginput" style="width:95%" data-key="' + esc(f.key) + '" value="' + esc(f.value).replace(/"/g, '&quot;') + '"></td></tr>';
      }
    });
    html += '</table>';
    html += '<p><button class="btn ok" type="submit">生成 Cypher 并预览级联</button> '
         + '<a class="btn" href="/approvals/image/' + id + '">审批页 →</a></p>';
    html += '<pre id="cypher-preview" class="doc small" style="display:none"></pre>';
    html += '<input type="hidden" name="cypher" id="cypher-input">';
    html += '</form>';
    box.innerHTML = html;
    box.className = '';
    box.querySelectorAll('input[data-key]').forEach(function (inp) {
      inp.addEventListener('input', buildCypher);
    });
    function buildCypher() {
      const sets = [];
      box.querySelectorAll('input[data-key]').forEach(function (inp) {
        const v = inp.value.trim();
        const lit = v === '' ? 'null' : (/^-?\d+(\.\d+)?$/.test(v) ? v : (/^(true|false)$/i.test(v) ? v.toLowerCase() : "'" + v.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'"));
        sets.push('n.' + inp.getAttribute('data-key') + ' = ' + lit);
      });
      const cy = 'MATCH (n {id: "' + id + '"}) SET ' + sets.join(', ');
      document.getElementById('cypher-input').value = cy;
      const pre = document.getElementById('cypher-preview');
      pre.style.display = 'block';
      pre.textContent = cy;
      return cy;
    }
    box._build = buildCypher;
    document.getElementById('editform').addEventListener('submit', function () {
      box._build();
    });
  });
}
</script>
{% endblock %}
