<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}代恋·管理页{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="topnav">
  <a href="/" class="brand">代恋 · 工作流管理</a>
  <a href="/">总览</a>
  <a href="/approvals">审批中心</a>
  <a href="/board">生产看板</a>
  <a href="/graph">叙事图</a>
  <a href="/data">数据</a>
  <a href="/agent">触发</a>
  <span class="nav-note">治理层 · 不执行生产</span>
</nav>
<main>
{% block content %}{% endblock %}
</main>
<footer class="foot">纯 Python · FastAPI + Jinja2 · Neo4j bolt://127.0.0.1:7687</footer>
<script>
document.addEventListener('click', function (ev) {
  var btn = ev.target.closest('.copy-hint');
  if (!btn) return;
  var text = btn.getAttribute('data-hint') || '';
  function done(ok) {
    var old = btn.textContent;
    btn.textContent = ok ? '✅ 已复制' : '❌ 复制失败';
    setTimeout(function () { btn.textContent = old; }, 1200);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { done(document.execCommand('copy')); } catch (e) { done(false); }
    document.body.removeChild(ta);
  }
});
</script>
</body>
</html>
